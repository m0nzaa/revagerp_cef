<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация и авторизация</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

    <!-- Блок регистрации -->
    <section class="registration" id="section-register">
        <div class="container">
            <h2 class="title-one">PERSONAGE REGISTRATION</h2>
            <h1 class="title-two">РЕГИСТРАЦИЯ</h1>
            <p class="text">Ознакомьтесь с правилами сервера и<br> настройками игры.</p>

            <div class="inputs">
                <img src="./img/user-icon.png" alt="Логин" />
                <input type="text" id="reg-login" placeholder="Логин" />
            </div>
            <div class="inputs">
                <img src="./img/paswword-icon.png" alt="Пароль" />
                <input type="password" id="reg-password" placeholder="Пароль" />
            </div>
            <div class="inputs">
                <img src="./img/paswword-icon.png" alt="Повтор пароля" />
                <input type="password" id="reg-password2" placeholder="Повторите пароль" />
            </div>

            <!-- Выбор пола -->
            <div style="display:flex; gap:12px; margin: 10px 0;">
                <label style="color:#fff; cursor:pointer;">
                    <input type="radio" name="gender" value="male" checked /> Мужской
                </label>
                <label style="color:#fff; cursor:pointer;">
                    <input type="radio" name="gender" value="female" /> Женский
                </label>
            </div>

            <p id="reg-error" style="color:#ff4444; display:none; margin-bottom:8px;"></p>

            <button onclick="doRegister()">Зарегистрироваться</button>
            <p class="text" style="padding-top: 20px;">
                Есть аккаунт? <a style="color:#fff; cursor:pointer;" onclick="showAuth()">Войти</a>
            </p>
        </div>
    </section>

    <!-- Блок авторизации -->
    <section class="authorization" id="section-auth" style="display:none;">
        <div class="container">
            <h2 class="title-one">PERSONAGE LOGIN</h2>
            <h1 class="title-two">АВТОРИЗАЦИЯ</h1>
            <p class="text">Ознакомьтесь с правилами сервера и<br> настройками игры.</p>

            <div class="inputs">
                <img src="./img/user-icon.png" alt="Логин" />
                <input type="text" id="auth-login" placeholder="Логин" />
            </div>
            <div class="inputs">
                <img src="./img/paswword-icon.png" alt="Пароль" />
                <input type="password" id="auth-password" placeholder="Пароль" />
            </div>

            <p id="auth-error" style="color:#ff4444; display:none; margin-bottom:8px;"></p>

            <button onclick="doLogin()">Войти</button>
            <p class="text" style="padding-top: 20px;">
                Нет аккаунта? <a style="color:#fff; cursor:pointer;" onclick="showRegister()">Зарегистрироваться</a>
            </p>
        </div>
    </section>

    <script>
        // ============================================================
        //  Переключение между формами
        // ============================================================
        function showAuth() {
            document.getElementById('section-register').style.display = 'none';
            document.getElementById('section-auth').style.display = 'block';
        }
        function showRegister() {
            document.getElementById('section-auth').style.display = 'none';
            document.getElementById('section-register').style.display = 'block';
        }

        // ============================================================
        //  Показ ошибки (вызывается с сервера через cef_emit_event)
        // ============================================================
        window.addEventListener('cef_auth_error', function(e) {
            var msg = e.detail && e.detail[0] ? e.detail[0] : 'Ошибка';
            // Показываем в активной форме
            var regErr  = document.getElementById('reg-error');
            var authErr = document.getElementById('auth-error');
            if (document.getElementById('section-register').style.display !== 'none') {
                regErr.textContent = msg;
                regErr.style.display = 'block';
            } else {
                authErr.textContent = msg;
                authErr.style.display = 'block';
            }
        });

        // ============================================================
        //  Сервер передаёт режим и ник через cef_emit_event("cef_init")
        //  Используем его чтобы показать нужную форму
        // ============================================================
        window.addEventListener('cef_init', function(e) {
            var mode = e.detail && e.detail[0];
            if (mode === 'login') {
                showAuth();
            } else {
                showRegister();
            }
        });

        // ============================================================
        //  Регистрация — отправляем данные на сервер через samp.callEvent
        // ============================================================
        function doRegister() {
            var password  = document.getElementById('reg-password').value;
            var password2 = document.getElementById('reg-password2').value;
            var gender    = document.querySelector('input[name="gender"]:checked').value;
            var errEl     = document.getElementById('reg-error');

            errEl.style.display = 'none';

            if (!password) {
                errEl.textContent = 'Введите пароль';
                errEl.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errEl.textContent = 'Пароль минимум 6 символов';
                errEl.style.display = 'block';
                return;
            }
            if (password !== password2) {
                errEl.textContent = 'Пароли не совпадают';
                errEl.style.display = 'block';
                return;
            }

            // Отправляем на сервер SA-MP
            samp.callEvent('cef_auth_register', password, gender);
        }

        // ============================================================
        //  Авторизация — отправляем данные на сервер через samp.callEvent
        // ============================================================
        function doLogin() {
            var password = document.getElementById('auth-password').value;
            var errEl    = document.getElementById('auth-error');

            errEl.style.display = 'none';

            if (!password) {
                errEl.textContent = 'Введите пароль';
                errEl.style.display = 'block';
                return;
            }

            // Отправляем на сервер SA-MP
            samp.callEvent('cef_auth_login', password);
        }
    </script>

</body>
</html>
