<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="layout-left">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand">Revage Roleplay</div>

            <div class="auth-title">С возвращением</div>
            <div class="auth-subtitle">Войдите под своим аккаунтом</div>

            <div class="field">
                <input type="text" placeholder="Логин">
            </div>
            <div class="field">
                <input type="password" placeholder="Пароль">
            </div>
            <div class="buttons-row">
                <button class="btn btn-primary">Войти</button>
                <a href="register.html" class="btn btn-secondary">Регистрация</a>
            </div>
            <div class="forgot">Забыли пароль?<a href="#">Восстановить</a></div>
        </div>
    </div>
</div>
<div class="scene-vignette"></div>
<div class="layout-right">
    <img src="img/pers.png" alt="">
    <div class="ground-glow"></div>
    <div class="project-title">
        Revage Roleplay
        <span>Авторизация персонажа</span>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('a').forEach(link => {
            if(link.getAttribute('href') && !link.getAttribute('href').startsWith('#')) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = link.href;
                    document.body.classList.add('page-exit');
                    setTimeout(() => {
                        window.location.href = target;
                    }, 280);
                });
            }
        });
    });
</script>
</body>
</html>
