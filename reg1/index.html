
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;600;700&display=swap');

.rr-scene {
  min-height: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 0;
  font-family: 'Inter', sans-serif;
}

.rr-outer {
  width: 460px;
  border-radius: 20px;
  overflow: hidden;
  background: #080808;
  border: 1px solid #1a1a1a;
}

.rr-banner {
  position: relative;
  height: 160px;
  background: #0d0d0d;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  padding: 0 2rem 1.25rem;
}

.rr-city {
  position: absolute;
  bottom: 0; left: 0; right: 0;
}

.rr-glow-orb {
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(180,130,30,0.18) 0%, transparent 70%);
  pointer-events: none;
}

.rr-brand {
  position: relative;
  z-index: 2;
}

.rr-brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 700;
  color: #D4A017;
  letter-spacing: 0.06em;
  line-height: 1;
  text-shadow: 0 0 40px rgba(212,160,23,0.4);
}

.rr-brand-sub {
  font-size: 10px;
  font-weight: 400;
  color: #4a4030;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-top: 5px;
}

.rr-live-badge {
  position: absolute;
  top: 16px;
  right: 18px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(20,20,20,0.9);
  border: 0.5px solid #2a2a2a;
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 11px;
  color: #888;
  letter-spacing: 0.08em;
}

.rr-live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4ade80;
  animation: pulse-dot 2s infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.rr-stats-row {
  display: flex;
  gap: 0;
  border-bottom: 0.5px solid #141414;
}

.rr-stat {
  flex: 1;
  padding: 12px 0;
  text-align: center;
  border-right: 0.5px solid #141414;
}
.rr-stat:last-child { border-right: none; }

.rr-stat-num {
  font-size: 16px;
  font-weight: 600;
  color: #D4A017;
  font-family: 'Cormorant Garamond', serif;
}

.rr-stat-label {
  font-size: 10px;
  color: #333;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 2px;
}

.rr-body {
  padding: 1.5rem 2rem 2rem;
}

.rr-tabs {
  display: flex;
  background: #0d0d0d;
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 1.5rem;
  border: 0.5px solid #1a1a1a;
}

.rr-tab {
  flex: 1;
  padding: 8px 0;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #333;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.25s;
  user-select: none;
}

.rr-tab.active {
  background: #161410;
  color: #D4A017;
  border: 0.5px solid #2a2010;
}

.rr-field { margin-bottom: 14px; }

.rr-field-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #3a3530;
  margin-bottom: 6px;
}

.rr-input {
  width: 100%;
  box-sizing: border-box;
  background: #0d0d0d;
  border: 0.5px solid #1e1e1e;
  border-radius: 10px;
  padding: 0 16px;
  height: 46px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: #c8b87a;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  letter-spacing: 0.02em;
}
.rr-input::placeholder { color: #252015; }
.rr-input:focus {
  border-color: #8B6914;
  background: #0f0e0a;
}

.rr-btn {
  width: 100%;
  height: 50px;
  background: #D4A017;
  border: none;
  border-radius: 10px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #0a0800;
  cursor: pointer;
  margin-top: 6px;
  transition: background 0.2s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.rr-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 100%;
  background: rgba(255,255,255,0.12);
  transform: skewX(-20deg);
  transition: left 0.4s;
}
.rr-btn:hover { background: #E8B420; }
.rr-btn:hover::after { left: 150%; }
.rr-btn:active { transform: scale(0.99); }

.rr-hint {
  text-align: center;
  font-size: 11px;
  color: #2a2520;
  margin-top: 14px;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: color 0.2s;
}
.rr-hint:hover { color: #8B6914; }

.rr-welcome-box {
  border: 0.5px solid #1e1a10;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
  background: #0b0a06;
  position: relative;
  overflow: hidden;
}
.rr-welcome-box::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: #D4A017;
}
.rr-welcome-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-weight: 600;
  color: #c8a840;
  margin-bottom: 5px;
}
.rr-welcome-text {
  font-size: 12px;
  color: #3a3020;
  line-height: 1.7;
}

.rr-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0 14px;
}
.rr-divider-line { flex: 1; height: 0.5px; background: #141414; }
.rr-divider-text { font-size: 10px; color: #222; letter-spacing: 0.1em; }

.rr-footer {

  font-size: 10px;
  color: #1e1a14;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.rr-page { display: none; }
.rr-page.active { display: block; }
</style>

<script>
function switchTab(tab) {
  document.querySelectorAll('.rr-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0) === (tab === 'login'));
  });
  document.getElementById('page-login').classList.toggle('active', tab === 'login');
  document.getElementById('page-register').classList.toggle('active', tab === 'register');
}

// Сервер говорит какой режим показать
cef.on('cef_init', function(mode) {
  if (mode === 'login') switchTab('login');
  else switchTab('register');
});

// Ошибка с сервера
cef.on('cef_auth_error', function(code) {
  var errors = {
    'err_mode':  'Ошибка режима. Переподключитесь.',
    'err_empty': 'Пароль не может быть пустым.',
    'err_short': 'Пароль слишком короткий (минимум 6 символов).',
    'err_long':  'Пароль слишком длинный (максимум 32 символа).',
    'err_pass':  'Неверный пароль. Попробуйте ещё раз.'
  };
  var loginActive = document.getElementById('page-login').classList.contains('active');
  var el = document.getElementById(loginActive ? 'login-error' : 'reg-error');
  el.textContent = errors[code] || code;
  el.style.display = 'block';
});

function doLogin() {
  var pass = document.getElementById('login-pass').value;
  var err = document.getElementById('login-error');
  err.style.display = 'none';
  if (!pass) { err.textContent = 'Введите пароль'; err.style.display = 'block'; return; }
  cef.emit('cef_auth_login', pass);
}

function doRegister() {
  var pass  = document.getElementById('reg-pass').value;
  var pass2 = document.getElementById('reg-pass2').value;
  var err   = document.getElementById('reg-error');
  err.style.display = 'none';
  if (!pass) { err.textContent = 'Введите пароль'; err.style.display = 'block'; return; }
  if (pass.length < 6) { err.textContent = 'Минимум 6 символов'; err.style.display = 'block'; return; }
  if (pass !== pass2) { err.textContent = 'Пароли не совпадают'; err.style.display = 'block'; return; }
  cef.emit('cef_auth_register', pass, 'male');
}
</script>
