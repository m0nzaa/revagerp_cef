<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Revage Roleplay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-user-drag:none}
body{background:#ffffff;color:#e5e5e5;min-height:100vh;display:flex;overflow:hidden;cursor:default}

.layout-left{width:75%;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;padding-right:15vw}
.layout-right{width:25%;height:100vh;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center}
.layout-right img{height:95%;width:auto;object-fit:contain;display:block;transform:translateX(-180px);filter:drop-shadow(0 0 20px rgba(0,0,0,0.5));position:relative;z-index:1;animation:slideInImage .8s cubic-bezier(0.2,0.8,0.2,1) forwards;opacity:0}
.layout-right::after{content:"";position:absolute;top:0;right:0;width:70%;height:100%;background:linear-gradient(to right,transparent,rgba(0,0,0,0.8));z-index:2;pointer-events:none;animation:fadeIn 1.2s ease-out forwards;opacity:0}

.project-title{position:absolute;bottom:8%;left:0;width:100%;text-align:center;font-size:64px;font-weight:900;font-style:italic;color:#fff;text-transform:uppercase;letter-spacing:2px;z-index:10;text-shadow:0 0 20px rgba(0,0,0,0.5),0 0 10px rgba(0,0,0,0.3);pointer-events:none;font-family:"Arial Black","Segoe UI Black",sans-serif;transform:translateX(-60px);animation:fadeInTitle 1s ease-out .3s forwards;opacity:0}

.auth-wrapper{width:100%;max-width:560px;padding:0 20px;transition:transform .3s ease}
.auth-card{background:#171717;border-radius:20px;padding:60px 70px 50px;box-shadow:0 25px 60px rgba(0,0,0,.6);animation:cardEntrance .6s cubic-bezier(0.2,0.8,0.2,1) forwards;opacity:0;transform:translateY(20px)}

@keyframes slideInImage{0%{transform:translateX(100px);opacity:0}100%{transform:translateX(-180px);opacity:1}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes fadeInTitle{0%{transform:translateX(-60px) translateY(20px);opacity:0}100%{transform:translateX(-60px) translateY(0);opacity:1}}
@keyframes cardEntrance{0%{transform:translateY(30px) scale(0.95);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

.auth-card.page-switching{animation:cardSwitch .25s cubic-bezier(0.4,0,0.2,1) forwards}
@keyframes cardSwitch{0%{opacity:1;transform:scale(1)}50%{opacity:0;transform:scale(0.97)}100%{opacity:1;transform:scale(1)}}

.auth-title{text-align:center;font-size:22px;line-height:1.5;color:#e0e0e0;margin-bottom:40px}
.auth-title span{display:block;font-size:16px;color:#9c9c9c;margin-top:8px}
.field{margin-bottom:20px}
.field input{width:100%;height:56px;background:#212121;border-radius:8px;border:none;outline:none;padding:0 20px;font-size:16px;color:#f5f5f5;user-select:text;-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;cursor:text}
.field input::placeholder{color:#777;user-select:none}
.buttons-row{display:flex;gap:16px;margin-top:30px}
.btn{flex:1;height:56px;border-radius:8px;border:none;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s,color .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn-primary{background:#3b3b3b;color:#f1f1f1}
.btn-secondary{background:#262626;color:#bbb}
.btn:disabled{opacity:.55;cursor:default}
.btn:hover:not(:disabled){background:#4a4a4a}
.forgot{margin-top:30px;text-align:center;font-size:14px;color:#8f8f8f}
.forgot a{margin-left:6px;font-size:14px;color:#e5e5e5;text-decoration:none;cursor:pointer}
.forgot a:hover{text-decoration:underline}

.error-msg{margin-top:14px;text-align:center;font-size:14px;color:#ff5555;min-height:20px;display:none}
.error-msg.visible{display:block}

.page{display:none}
.page.active{display:block}

@media(min-width:1921px){.auth-wrapper{transform:scale(1.2)}.project-title{font-size:80px}}
@media(max-height:800px){.auth-wrapper{transform:scale(0.85)}}
@media(max-width:900px){.layout-right{display:none}.layout-left{width:100%;padding-right:0}}
@media(max-width:600px){.auth-card{padding:40px 30px 35px}.auth-wrapper{max-width:100%}}
    </style>
</head>
<body>

<div class="layout-left">
    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <!-- ======== ЛОГИН ======== -->
            <div class="page active" id="page-login">
                <div class="auth-title">
                    Добро пожаловать на сервер.
                    <span>Войдите под своим аккаунтом.</span>
                </div>
                <div class="field">
                    <input type="text" id="login-name" placeholder="Введите никнейм" autocomplete="off" />
                </div>
                <div class="field">
                    <input type="password" id="login-pass" placeholder="Введите пароль" />
                </div>
                <div class="error-msg" id="login-error"></div>
                <div class="buttons-row">
                    <button class="btn btn-primary" onclick="doLogin()">Войти</button>
                    <button class="btn btn-secondary" onclick="switchPage('register')">Зарегистрироваться</button>
                </div>
                <div class="forgot">
                    Забыли пароль? <a onclick="void(0)">Восстановить</a>
                </div>
            </div>

            <!-- ======== РЕГИСТРАЦИЯ ======== -->
            <div class="page" id="page-register">
                <div class="auth-title">
                    Добро пожаловать на сервер.
                    <span>Вам необходимо пройти регистрацию.</span>
                </div>
                <div class="field">
                    <input type="text" id="reg-name" placeholder="Введите никнейм" autocomplete="off" />
                </div>
                <div class="field">
                    <input type="password" id="reg-pass" placeholder="Придумайте пароль" />
                </div>
                <div class="field">
                    <input type="password" id="reg-pass2" placeholder="Повторите пароль" />
                </div>
                <div class="error-msg" id="reg-error"></div>
                <div class="buttons-row">
                    <button class="btn btn-primary" onclick="doRegister()">Зарегистрироваться</button>
                    <button class="btn btn-secondary" onclick="switchPage('login')">Отмена</button>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="layout-right">
    <div class="project-title">Revage Roleplay</div>
    <img src="img/pers.png" alt="">
</div>

<script>
// ============================================================
//  CEF API — samp-cef
//  cef.on()   = слушаем событие с сервера (cef_emit_event)
//  cef.emit() = отправляем событие на сервер (cef_subscribe)
// ============================================================

// ── Переключение страниц ──────────────────────────────────
function switchPage(page) {
    var card = document.getElementById('authCard');
    card.classList.add('page-switching');
    setTimeout(function() {
        document.querySelectorAll('.page').forEach(function(p) {
            p.classList.remove('active');
        });
        document.getElementById('page-' + page).classList.add('active');
        clearErrors();
        card.classList.remove('page-switching');
    }, 125);
}

// ── Ошибки ───────────────────────────────────────────────
function clearErrors() {
    ['login-error', 'reg-error'].forEach(function(id) {
        var el = document.getElementById(id);
        el.textContent = '';
        el.classList.remove('visible');
    });
}

function showError(id, text) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.classList.add('visible');
}

// ── Сервер говорит какой режим показать ──────────────────
// PAWN: cef_emit_event(playerid, "cef_init", CEFSTR(mode))
// mode = "login" или "register"
cef.on('cef_init', function(mode) {
    if (mode === 'login') switchPage('login');
    else switchPage('register');
});

// ── Ошибка с сервера ─────────────────────────────────────
// PAWN: cef_emit_event(playerid, "cef_auth_error", CEFSTR("err_pass"))
cef.on('cef_auth_error', function(code) {
    var errors = {
        'err_mode':         'Ошибка режима. Переподключитесь.',
        'err_login_empty':  'Никнейм не может быть пустым.',
        'err_login_short':  'Никнейм слишком короткий (минимум 3 символа).',
        'err_login_long':   'Никнейм слишком длинный (максимум 20 символов).',
        'err_empty':        'Пароль не может быть пустым.',
        'err_short':        'Пароль слишком короткий (минимум 6 символов).',
        'err_long':         'Пароль слишком длинный (максимум 32 символа).',
        'err_pass':         'Неверный никнейм или пароль. Попробуйте ещё раз.'
    };
    var msg = errors[code] || code;
    var loginActive = document.getElementById('page-login').classList.contains('active');
    showError(loginActive ? 'login-error' : 'reg-error', msg);
});

// ── Кнопка "Войти" ───────────────────────────────────────
// PAWN: cef_subscribe("cef_auth_login", "CefAuth_OnLogin")
// Параметры: login, password
function doLogin() {
    clearErrors();
    var name = document.getElementById('login-name').value.trim();
    var pass = document.getElementById('login-pass').value;

    if (!name) {
        showError('login-error', 'Введите никнейм.');
        return;
    }
    if (!pass) {
        showError('login-error', 'Введите пароль.');
        return;
    }
    if (pass.length < 6) {
        showError('login-error', 'Минимум 6 символов.');
        return;
    }

    cef.emit('cef_auth_login', name, pass);
}

// ── Кнопка "Зарегистрироваться" ──────────────────────────
// PAWN: cef_subscribe("cef_auth_register", "CefAuth_OnRegister")
// Параметры: login, password, gender
function doRegister() {
    clearErrors();
    var name  = document.getElementById('reg-name').value.trim();
    var pass  = document.getElementById('reg-pass').value;
    var pass2 = document.getElementById('reg-pass2').value;

    if (!name) {
        showError('reg-error', 'Введите никнейм.');
        return;
    }
    if (name.length < 3) {
        showError('reg-error', 'Никнейм слишком короткий (минимум 3 символа).');
        return;
    }
    if (name.length > 20) {
        showError('reg-error', 'Никнейм слишком длинный (максимум 20 символов).');
        return;
    }
    if (!pass) {
        showError('reg-error', 'Введите пароль.');
        return;
    }
    if (pass.length < 6) {
        showError('reg-error', 'Минимум 6 символов.');
        return;
    }
    if (pass.length > 32) {
        showError('reg-error', 'Максимум 32 символа.');
        return;
    }
    if (pass !== pass2) {
        showError('reg-error', 'Пароли не совпадают.');
        return;
    }

    // gender='male' по умолчанию, можно добавить выбор позже
    cef.emit('cef_auth_register', name, pass, 'male');
}

// ── Enter для удобства ────────────────────────────────────
document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    if (document.getElementById('page-login').classList.contains('active')) doLogin();
    else doRegister();
});
</script>

</body>
</html>
