<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Revage Roleplay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}

body{
    background:#111213;
    color:#e5e5e5;
    min-height:100vh;
    display:flex;
    overflow:hidden;
    cursor:default;
    position:relative;
}

/* единый фон на весь экран - без стыка между половинами */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(ellipse 70% 60% at 78% 55%, rgba(255,255,255,0.035) 0%, transparent 65%),
        #111213;
    z-index:0;
}

/* ───────── левая половина — форма ───────── */
.layout-left{
    width:46%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:3;
}

/* ───────── правая половина — арт персонажа на том же фоне ───────── */
.layout-right{
    width:54%;
    height:100vh;
    position:relative;
    overflow:hidden;
    z-index:1;
}
.layout-right img{
    position:absolute;
    bottom:0;
    left:38%;
    height:102%;
    width:auto;
    max-width:none;
    object-fit:cover;
    transform:translateX(-42%) scale(1.04);
    opacity:0;
    animation:fadeInImage .8s ease-out .1s forwards;
    /* растушёвка по краям картинки вместо прямого среза */
    -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 22%, #000 88%, transparent 100%),
                        linear-gradient(to bottom, #000 80%, transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right, transparent 0%, #000 22%, #000 88%, transparent 100%),
                linear-gradient(to bottom, #000 80%, transparent 100%);
    mask-composite:intersect;
    filter:drop-shadow(0 30px 40px rgba(0,0,0,.5));
}

/* мягкий контактный блик под ногами персонажа - "стоит на полу" */
.layout-right .ground-glow{
    position:absolute;
    left:38%;
    bottom:0;
    width:46%;
    height:18%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse 60% 100% at 50% 100%, rgba(255,255,255,.07), transparent 70%);
    z-index:1;
    pointer-events:none;
}

/* лёгкая общая виньетка снизу всего экрана - объединяет обе половины */
.scene-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,.4) 0%, transparent 22%);
}

.project-title{
    position:absolute;
    right:40px;
    bottom:36px;
    z-index:5;
    font-size:22px;
    font-weight:600;
    letter-spacing:.04em;
    color:#e8e8e8;
    text-align:right;
    opacity:0;
    animation:fadeInUp .5s ease-out .25s forwards;
}
.project-title span{
    display:block;
    margin-top:4px;
    font-size:13px;
    font-weight:400;
    color:#6b6b6b;
    letter-spacing:.02em;
}

/* ───────── форма ───────── */
.auth-wrapper{width:100%;max-width:380px;padding:0 44px}
.auth-card{
    opacity:0;
    transform:translateY(10px);
    animation:fadeInUp .45s ease-out forwards;
}
.auth-card.switching{animation:cardSwitch .18s ease forwards}
@keyframes cardSwitch{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeInImage{0%{opacity:0;transform:translateX(-50%) scale(1.05)}100%{opacity:1;transform:translateX(-50%) scale(1.02)}}

.brand{font-size:13px;font-weight:600;letter-spacing:.12em;color:#5c5c5c;text-transform:uppercase;margin-bottom:28px}

.tabs{display:flex;gap:24px;margin-bottom:30px;border-bottom:1px solid #232425}
.tab{
    position:relative;
    padding:0 0 12px;
    background:none;border:none;
    font-size:14px;font-weight:500;color:#5c5c5c;
    cursor:pointer;
    transition:color .15s;
}
.tab:hover{color:#9b9b9b}
.tab.active{color:#f0f0f0}
.tab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:#f0f0f0;
    border-radius:2px;
}

.auth-title{font-size:19px;font-weight:600;color:#f0f0f0;margin-bottom:4px}
.auth-subtitle{font-size:13px;color:#6b6b6b;margin-bottom:26px}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#6b6b6b;margin-bottom:6px}
.field input{
    width:100%;height:44px;
    background:#1a1b1c;
    border:1px solid #27282a;
    border-radius:6px;
    outline:none;
    padding:0 14px;
    font-size:14px;
    color:#eaeaea;
    user-select:text;-webkit-user-select:text;
    cursor:text;
    transition:border-color .15s, background .15s;
}
.field input::placeholder{color:#55575a}
.field input:focus{border-color:#4a4b4d;background:#1d1e1f}

.error-msg{
    font-size:12px;color:#e2574c;
    min-height:0;margin:0 0 0;
    max-height:0;overflow:hidden;
    transition:max-height .15s ease, margin .15s ease;
}
.error-msg.visible{max-height:30px;margin:2px 0 10px}

.buttons-row{margin-top:18px}
.btn{
    width:100%;height:44px;
    border-radius:6px;border:none;
    font-size:14px;font-weight:600;
    cursor:pointer;
    transition:background .15s, opacity .15s, transform .1s;
}
.btn:active{transform:scale(.99)}
.btn-primary{background:#eaeaea;color:#121212}
.btn-primary:hover{background:#ffffff}

.switch-line{margin-top:20px;text-align:center;font-size:13px;color:#6b6b6b}
.switch-line a{margin-left:5px;color:#c9c9c9;text-decoration:none;cursor:pointer}
.switch-line a:hover{color:#f0f0f0;text-decoration:underline}

.forgot{margin-top:14px;text-align:center}
.forgot a{font-size:12.5px;color:#55575a;text-decoration:none;cursor:pointer}
.forgot a:hover{color:#8a8a8a}

.page{display:none}
.page.active{display:block}

@media(max-width:900px){
    .layout-right{display:none}
    .layout-left{width:100%}
}
@media(max-height:700px){.auth-wrapper{transform:scale(.92)}}
    </style>
</head>
<body>

<div class="layout-left">
    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <div class="brand">Revage Roleplay</div>

            <div class="tabs">
                <button class="tab active" id="tab-login"    onclick="switchTab('login')">Вход</button>
                <button class="tab"        id="tab-register" onclick="switchTab('register')">Регистрация</button>
            </div>

            <!-- ЛОГИН -->
            <div class="page active" id="page-login">
                <div class="auth-title">С возвращением</div>
                <div class="auth-subtitle">Войдите под своим аккаунтом</div>

                <div class="field">
                    <input type="password" id="login-pass" placeholder="Пароль" />
                </div>
                <div class="error-msg" id="login-error"></div>

                <div class="buttons-row">
                    <button class="btn btn-primary" onclick="doLogin()">Войти</button>
                </div>

                <div class="forgot"><a onclick="void(0)">Забыли пароль?</a></div>
                <div class="switch-line">Нет аккаунта?<a onclick="switchTab('register')">Зарегистрироваться</a></div>
            </div>

            <!-- РЕГИСТРАЦИЯ -->
            <div class="page" id="page-register">
                <div class="auth-title">Создание аккаунта</div>
                <div class="auth-subtitle">Придумайте пароль для входа</div>

                <div class="field">
                    <input type="password" id="reg-pass" placeholder="Пароль" />
                </div>
                <div class="field">
                    <input type="password" id="reg-pass2" placeholder="Повторите пароль" />
                </div>
                <div class="error-msg" id="reg-error"></div>

                <div class="buttons-row">
                    <button class="btn btn-primary" onclick="doRegister()">Зарегистрироваться</button>
                </div>

                <div class="switch-line">Уже есть аккаунт?<a onclick="switchTab('login')">Войти</a></div>
            </div>

        </div>
    </div>
</div>

<div class="scene-vignette"></div>
<div class="layout-right">
    <img src="img/pers.png" alt="">
    <div class="ground-glow"></div>
    <div class="project-title">
        Revage Roleplay
        <span>Авторизация персонажа</span>
    </div>
</div>

<script>
function switchTab(tab) {
    var card = document.getElementById('authCard');
    card.classList.add('switching');
    setTimeout(function() {
        ['login','register'].forEach(function(t) {
            document.getElementById('page-' + t).classList.toggle('active', t === tab);
            document.getElementById('tab-'  + t).classList.toggle('active', t === tab);
        });
        clearErrors();
        card.classList.remove('switching');
    }, 90);
}

function clearErrors() {
    ['login-error','reg-error'].forEach(function(id) {
        var el = document.getElementById(id);
        el.textContent = '';
        el.classList.remove('visible');
    });
}
function showError(id, text) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.classList.add('visible');
}

cef.on('cef_init', function(mode) {
    switchTab(mode === 'login' ? 'login' : 'register');
});

cef.on('cef_auth_error', function(code) {
    var errors = {
        'err_mode':  'Ошибка режима. Переподключитесь.',
        'err_empty': 'Введите пароль.',
        'err_short': 'Пароль слишком короткий (минимум 6 символов).',
        'err_long':  'Пароль слишком длинный (максимум 32 символа).',
        'err_pass':  'Неверный пароль. Попробуйте ещё раз.'
    };
    var isLogin = document.getElementById('page-login').classList.contains('active');
    showError(isLogin ? 'login-error' : 'reg-error', errors[code] || code);
});

function doLogin() {
    clearErrors();
    var pass = document.getElementById('login-pass').value;
    if (!pass) { showError('login-error', 'Введите пароль.'); return; }
    if (pass.length < 6) { showError('login-error', 'Минимум 6 символов.'); return; }
    cef.emit('cef_auth_login', pass);
}

function doRegister() {
    clearErrors();
    var pass  = document.getElementById('reg-pass').value;
    var pass2 = document.getElementById('reg-pass2').value;
    if (!pass)           { showError('reg-error', 'Введите пароль.'); return; }
    if (pass.length < 6) { showError('reg-error', 'Минимум 6 символов.'); return; }
    if (pass.length > 32){ showError('reg-error', 'Максимум 32 символа.'); return; }
    if (pass !== pass2)  { showError('reg-error', 'Пароли не совпадают.'); return; }
    cef.emit('cef_auth_register', pass, 'male');
}

document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    if (document.getElementById('page-login').classList.contains('active')) doLogin();
    else doRegister();
});
</script>

</body>
</html>
