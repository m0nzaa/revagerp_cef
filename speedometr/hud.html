<script>
// ================================================================
//  Константы длин SVG-дуг (из viewBox путей)
// ================================================================
var SPEEDO_LEN = 504.295;   // спидометр  — макс. км/ч = 280 (можно менять)
var FUEL_LEN   = 208.907;   // топливо    — 0..100%
var HP_LEN     = 118.296;   // здоровье   — 0..100%
var SPEED_MAX  = 280;       // максимальная скорость на шкале

// ================================================================
//  Вспомогательная функция: считает stroke-dashoffset
//  value  — текущее значение (0..max)
//  max    — максимум шкалы
//  len    — полная длина дуги
//  Когда value=0   → offset=len   (дуга скрыта)
//  Когда value=max → offset=0     (дуга заполнена)
// ================================================================
function calcOffset(value, max, len) {
    var clamped = Math.max(0, Math.min(value, max));
    return len - (len * clamped / max);
}

// ================================================================
//  Обновление спидометра
// ================================================================
function updateSpeed(speed) {
    var offset = calcOffset(speed, SPEED_MAX, SPEEDO_LEN);
    $("#hud-speedometer").css({
        "stroke-dasharray":  SPEEDO_LEN + ", " + SPEEDO_LEN,
        "stroke-dashoffset": offset
    });
    $("#textspeed").text(speed);
}

// ================================================================
//  Обновление топлива
// ================================================================
function updateFuel(fuel) {
    var offset = calcOffset(fuel, 100, FUEL_LEN);
    $("#hud-fuel").css({
        "stroke-dasharray":  FUEL_LEN + ", " + FUEL_LEN,
        "stroke-dashoffset": offset
    });
}

// ================================================================
//  Обновление HP / движка
// ================================================================
function updateHP(hp) {
    var offset = calcOffset(hp, 100, HP_LEN);
    $("#hud-engine").css({
        "stroke-dasharray":  HP_LEN + ", " + HP_LEN,
        "stroke-dashoffset": offset
    });
    $("#healproc").text(hp + "%");
}

// ================================================================
//  Обновление кнопок статуса
//  engine  — 1/0 (двигатель)
//  doors   — 0=закрыты 1=открыты  (GetVehicleParamsEx)
//  belt    — 1/0 (ремень)
//  lights  — 1/0 (фары)
// ================================================================
function updateButtons(engine, doors, belt, lights) {
    // Круиз-контроль — управляется отдельным событием, здесь не трогаем
    $("#eng").attr("class",  "hud-speedomter-footer-item ctrl "  + (engine ? "on" : "off"));
    $("#door").attr("class", "hud-speedomter-footer-item door "  + (doors  ? "on" : "off"));
}

// ================================================================
//  CEF-события от сервера
//  В браузере SAMP-CEF события приходят через window.addEventListener
// ================================================================

window.addEventListener("speedo_show", function() {
    $(".hud-speedometer").css("display", "block");
    $(".hud-speedomter-footer").css("display", "flex");
});

window.addEventListener("speedo_hide", function() {
    $(".hud-speedometer").css("display", "none");
    $(".hud-speedomter-footer").css("display", "none");
    updateSpeed(0);
    updateFuel(0);
    updateHP(0);
});

// speedo_data(speed, fuel, hp, engine, doors, belt, lights)
window.addEventListener("speedo_data", function(e) {
    var d = e.detail;
    updateSpeed(d[0]);
    updateFuel(d[1]);
    updateHP(d[2]);
    updateButtons(d[3], d[4], d[5], d[6]);
});

window.addEventListener("speedo_cruise", function(e) {
    var state = e.detail[0];
    $("#cruise").attr("class", "hud-speedomter-footer-item cruise " + (state ? "on" : "off"));
});
</script>
