<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">
        <div class="screen main-menu">
            <header>
                <div class="header-left">
                    <img src="img/Avatar.png" alt="" class="avatar">
                    <div class="header-name">Valdemar</div>
                </div>
                <div class="header-right">
                    <img src="img/Search.png" alt="">
                    <img src="img/Folder.png" alt="">
                </div>
            </header>
            <div class="bank-content">
                <div class="bank-balance">
                    <img src="img/$.png" alt="" class="img">
                    <div class="bank-title text">Баланс карты</div>
                    <div class="bank-money text">$44.444,13</div>
                </div>
            </div>
            <div class="apps">
                    <div class="icon-grid">
                        <div class="icon-card">
                            <div class="icon-image">
                            <img src="img/home_alt_fill.svg" alt="">
                            </div>
                            <p class="text">Дом</p>
                        </div>
                        <div class="icon-card">
                            <div class="icon-image">
                            <img src="img/taxi.png" alt="Иконка 2">
                            </div>
                            <p>Такси</p>
                        </div>
                        <div class="icon-card">
                            <div class="icon-image">
                            <img src="img/location_outline.svg" alt="Иконка 3">
                            </div>
                            <p>GPS</p>
                        </div>
                        <div class="icon-card">
                            <div class="icon-image">
                            <img src="img/emergency-call-svgrepo-com.svg" alt="Иконка 4">
                            </div>
                            <p>Помощь</p>
                        </div>
                        <div class="icon-card">
                            <div class="icon-image">
                            <img src="img/users.png" alt="Иконка 5">
                            </div>
                            <p>Контакты</p>
                        </div>
                        <div class="icon-card">
                            <div class="icon-image">
                            <img src="img/dollar-symbol.png" alt="Иконка 6">
                            </div>
                            <p>Банк</p>
                        </div>

                    </div>
            </div>
        </div>
    </div>


    <script src="index.js"></script>
</body>
</html>
